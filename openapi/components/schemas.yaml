    category:
      type: string
    brand:
      type: string
    image:
      type: string
      format: uri
    inventory:
      type: integer
    tenant_id:
      type: string
  required: [title, price]

ProductListResponse:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/Product'
    total:
      type: integer
  required: [items, total]

PurchaseResponse:
  type: object
  properties:
    status:
      type: string
    product:
      $ref: '#/Product'
    quantity:
      type: integer
    message:
      type: string
  required: [status, product, quantity, message]

Plugin:
