/api/v1/intelligence-effectiveness/recommendations:
  get:
    summary: Recommendation effectiveness metrics
    tags:
    - Intelligence
    responses:
      '200':
        description: Recommendation effectiveness
        content:
          application/json:
            schema:
              type: object
              properties:
                recommendations:
                  type: array
                  items:
                    $ref: ./components/schemas.yaml#/RecommendationEffectivenessItem
                computed_at:
                  type: string
                  format: date-time
      '500':
        $ref: '#/components/responses/InternalError'
    operationId: intelligenceListIntelligenceeffectivenessRecommendations
    x-maturity: beta
    x-stabilitySince: 1.5.0-beta.1
    x-owner: Intelligence Team
    x-reviewed: '2026-06-26'
    x-breakingChangesAllowed: true
    x-expectedStable: 1.6.0
    x-feedback: https://github.com/gd-workflow-bridge-pro/api/issues
