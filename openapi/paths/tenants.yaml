/api/v1/marketplace/tenants/{tenantId}/remediate/{action}/preview:
  post:
    summary: Preview a remediation action for a tenant
    tags:
    - Marketplace
    parameters:
    - name: tenantId
      in: path
      required: true
      schema:
        type: string
    - name: action
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z-]+$
    responses:
      '200':
        description: Remediation preview result
        content:
          application/json:
            schema:
              $ref: ./components/schemas.yaml#/RemediationPreviewResponse
      '400':
        $ref: '#/components/responses/BadRequest'
      '404':
        $ref: '#/components/responses/NotFound'
    operationId: marketplaceCreateMarketplaceTenantsRemediatePreview
