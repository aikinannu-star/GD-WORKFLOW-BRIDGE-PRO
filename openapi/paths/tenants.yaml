/api/v1/marketplace/tenants/{tenantId}/remediate/install-missing-deps:
  post:
    summary: Install missing dependencies for a tenant
    tags:
    - Marketplace
    parameters:
    - name: tenantId
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Dependency remediation result
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                installed_count:
                  type: integer
                installed:
                  type: array
                  items:
                    type: string
      '400':
        $ref: '#/components/responses/BadRequest'
    operationId: marketplaceCreateMarketplaceTenantsRemediateInstallmissingdeps
    x-maturity: stable
    x-stabilitySince: 1.4.0
    x-owner: Marketplace Team
    x-reviewed: '2026-06-26'
    x-breakingChangesAllowed: false
    x-feedback: https://github.com/gd-workflow-bridge-pro/api/issues
/api/v1/marketplace/tenants/{tenantId}/remediate/activate-keys:
  post:
    summary: Activate revoked keys for a tenant
    tags:
    - Marketplace
    parameters:
    - name: tenantId
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              key_ids:
                type: array
                items:
                  type: string
    responses:
      '200':
        description: Key activation result
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                activated_count:
                  type: integer
                activated:
                  type: array
                  items:
                    type: string
      '400':
        $ref: '#/components/responses/BadRequest'
    operationId: marketplaceCreateMarketplaceTenantsRemediateActivatekeys
    x-maturity: stable
    x-stabilitySince: 1.4.0
    x-owner: Marketplace Team
    x-reviewed: '2026-06-26'
    x-breakingChangesAllowed: false
    x-feedback: https://github.com/gd-workflow-bridge-pro/api/issues
