/api/v1/marketplace/tenants/{tenantId}:
  get:
    summary: Get tenant health and stats
    tags:
    - Marketplace
    parameters:
    - name: tenantId
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Tenant stats
