/api/v1/marketplace/platform/timeseries:
  get:
    summary: Platform time-series data
    tags:
    - Platform
    parameters:
    - name: tenant_id
      in: query
      schema:
        type: string
    - name: tenant_ids
      in: query
      schema:
        type: string
    - name: metric
      in: query
      schema:
        type: string
        default: health_score
    - name: period
      in: query
      schema:
        type: string
        default: hourly
    - name: days_back
      in: query
      schema:
        type: integer
        default: 7
    - name: forecast_horizon
      in: query
      schema:
        type: integer
        default: 0
    responses:
      '200':
        description: Time series response
        content:
          application/json:
            schema:
              $ref: ./components/schemas.yaml#/TimeSeriesResponse
    operationId: platformListMarketplacePlatformTimeseries
    x-maturity: stable
    x-stabilitySince: 1.2.0
    x-owner: Platform Team
    x-reviewed: '2026-06-26'
    x-breakingChangesAllowed: false
    x-feedback: https://github.com/gd-workflow-bridge-pro/api/issues
