global:
  resolve_timeout: 5m

# Notification templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# The root route with all parameters, which are inherited by the child routes if they are not overwritten.
route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 1h
    
    # Warning alerts - batch
    - match:
        severity: warning
      receiver: 'warnings'
      group_wait: 30s
      repeat_interval: 4h
    
    # Auth service alerts
    - match:
        component: auth
      receiver: 'auth-team'
      group_interval: 5m
    
    # Marketplace service alerts
    - match:
        component: marketplace
      receiver: 'platform-team'
      group_interval: 10m
    
    # System alerts
    - match:
        component: system
      receiver: 'ops-team'

receivers:
  # Default receiver (silence)
  - name: 'default'

  # Critical alerts: log to console (for local dev)
  - name: 'critical'
    webhook_configs:
      - url: 'http://localhost:5000/alert'
        send_resolved: true

  # Warning alerts: log to console
  - name: 'warnings'
    webhook_configs:
      - url: 'http://localhost:5000/alert'
        send_resolved: true

  # Auth team: could integrate with Slack, PagerDuty, etc.
  - name: 'auth-team'
    webhook_configs:
      - url: 'http://localhost:5000/alert/auth'
        send_resolved: true

  # Platform team: could integrate with Slack, PagerDuty, etc.
  - name: 'platform-team'
    webhook_configs:
      - url: 'http://localhost:5000/alert/platform'
        send_resolved: true

  # Ops team: could integrate with Slack, PagerDuty, etc.
  - name: 'ops-team'
    webhook_configs:
      - url: 'http://localhost:5000/alert/ops'
        send_resolved: true

# Inhibition rules prevent alerts from being sent if certain other alerts are already firing
inhibit_rules:
  # Inhibit all other alerts when the gateway is down
  - source_match:
      alertname: 'ServiceDown'
      job: 'api-gateway'
    target_match_re:
      job: 'auth-service|marketplace-service|billing-service|license-server'
    equal: ['environment']
  
  # Inhibit high latency alerts if there's a gateway error spike
  - source_match:
      alertname: 'Gateway5xxErrorsSpike'
    target_match:
      alertname: 'GatewayHighLatency'
    equal: ['instance']
