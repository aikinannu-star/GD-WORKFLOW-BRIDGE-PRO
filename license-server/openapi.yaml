openapi: 3.0.0
info:
  title: GDWB License Server API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check for the license server
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/jwks:
    get:
      summary: JSON Web Key Set for verifying JWTs
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                type: object
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
  /observability:
    get:
      summary: Simple observability dashboard
      responses:
        '200':
          description: HTML observability page
          content:
            text/html:
              schema:
                type: string
  /api/v1/metrics/history:
    get:
      summary: Metrics history for observability UI
      parameters:
        - name: n
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Metrics history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /.well-known/openid-configuration:
    get:
      summary: OpenID Connect discovery document
      responses:
        '200':
          description: OIDC discovery metadata
          content:
            application/json:
              schema:
                type: object
  /api/v1/admin/token:
    post:
      summary: Issue an admin JWT
      security:
        - BearerAuth: []
        - BasicAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Admin token issued
          content:
            application/json:
              schema:
                type: object
  /api/v1/admin/token/revoke:
    post:
      summary: Revoke an admin JWT
      security:
        - BearerAuth: []
        - BasicAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jti:
                  type: string
                token:
                  type: string
              required: [jti]
      responses:
        '200':
          description: Admin token revoked
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/token:
    post:
      summary: Issue a token for client credentials or license grants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials, license, password]
                client_id:
                  type: string
                client_secret:
                  type: string
                license_key:
                  type: string
                site:
                  type: string
                plan:
                  type: string
              required: [grant_type]
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /oauth/token:
    post:
      summary: Alternate token endpoint for OAuth-compatible clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials, license, password]
                client_id:
                  type: string
                client_secret:
                  type: string
                license_key:
                  type: string
                site:
                  type: string
              required: [grant_type]
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/v1/validate:
    post:
      summary: Validate a license key and return a signed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                license_key:
                  type: string
                site:
                  type: string
                plan:
                  type: string
              required: [license_key]
      responses:
        '200':
          description: License validated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
        '400':
          description: Bad Request
  /api/v1/revoke:
    post:
      summary: Revoke a license (admin only)
      security:
        - BearerAuth: []
        - BasicAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/introspect:
    post:
      summary: Introspect a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrospectRequest'
      responses:
        '200':
          description: Token introspection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Token
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
      required: [success, message]
    RevokeRequest:
      type: object
      properties:
        license_key:
          type: string
        admin_secret:
          type: string
      required: [license_key, admin_secret]
    RevokeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
      required: [success, message]
    IntrospectRequest:
      type: object
      properties:
        token:
          type: string
      required: [token]
    IntrospectResponse:
      type: object
      properties:
        success:
          type: boolean
        payload:
          $ref: '#/components/schemas/TokenPayload'
      required: [success, payload]
    EntitlementModel:
      type: object
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        features:
          type: array
          items:
            type: string
      required: [plan, features]
    Plan:
      type: string
      enum: [free, pro, enterprise]
    PlanDetails:
      type: object
      properties:
        name:
          type: string
        tier:
          type: integer
        features:
          type: array
          items:
            type: string
        limits:
          type: object
          properties:
            projects:
              type: integer
              nullable: true
            workflows:
              type: integer
              nullable: true
            api_calls_per_day:
              type: integer
              nullable: true
            storage_gb:
              type: integer
              nullable: true
        support:
          type: string
          enum: [community, email, phone]
      required: [name, tier, features, limits, support]
    TokenPayload:
      type: object
      properties:
        iss:
          type: string
          example: "gdwb-license-server"
        sub:
          type: string
          example: "LICENSE-KEY-XXXXX"
        aud:
          type: string
          example: "gd-workflow-bridge-pro"
        iat:
          type: integer
          description: "Issued at (Unix timestamp)"
        exp:
          type: integer
          description: "Expiration (Unix timestamp)"
        jti:
          type: string
          description: "JWT ID for revocation tracking"
        plan:
          type: string
          enum: [free, pro, enterprise]
          description: "License tier / plan"
        tier:
          type: integer
          description: "Numeric tier level (1=free, 2=pro, 3=enterprise)"
        scope:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string
          description: "List of available features for this license tier"
        site:
          type: string
          nullable: true
          description: "Site URL where license was activated"
      required: [iss, sub, aud, iat, exp, jti]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        env:
          type: string
        db:
          type: boolean
        time:
          type: string
          format: date-time
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
      required: [access_token, token_type, expires_in]
    ValidateResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        exp:
          type: integer
      required: [success, token, exp]
