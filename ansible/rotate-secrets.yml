---
# Local playbook to generate and store rotated client secrets in Vault
- hosts: localhost
  gather_facts: no
  vars:
    client_id: "{{ client_id | default('dev-client') }}"
    vault_addr: "{{ vault_addr | default(lookup('env','VAULT_ADDR')) }}"
    vault_token: "{{ vault_token | default(lookup('env','VAULT_TOKEN')) }}"
    vault_path: "{{ vault_path | default('secret/data/gdwb') }}"
  tasks:
    - name: Generate new client secret
      command: php license-server/generate_client.php "{{ client_id }}"
      register: gen

    - name: Extract secret from generator output
      set_fact:
        secret_line: "{{ (gen.stdout_lines | select('search', 'Secret (store securely, shown once):') | list).0 }}"
        secret_value: "{{ secret_line.split(':')[-1] | trim }}"

    - name: Build payload for Vault KV v2
      set_fact:
        payload: "{{ {'data': { ('CLIENT_' + client_id | upper | regex_replace('[^A-Z0-9]','_') + '_SECRET'): secret_value } } }}"

    - name: Write secret to Vault (KV v2)
      uri:
        url: "{{ vault_addr }}/v1/{{ vault_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body: "{{ payload | to_json }}"
        status_code: 200,201,204
        body_format: json
