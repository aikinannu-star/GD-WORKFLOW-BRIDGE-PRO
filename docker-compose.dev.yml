version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: gdwb_dev
      POSTGRES_USER: gdwb
      POSTGRES_PASSWORD: gdwb
    ports:
      - '5432:5432'
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data
    ports:
      - '9000:9000'
    volumes:
      - ./docker-data/minio:/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - ./docker-data/redis:/data
