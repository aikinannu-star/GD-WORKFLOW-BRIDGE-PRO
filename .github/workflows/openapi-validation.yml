name: OpenAPI Contract Validation & SDK Generation

on:
  push:
    branches: [main, develop]
    paths:
      - 'openapi/**'
      - '.github/workflows/openapi-validation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'openapi/**'

jobs:
  validate:
    name: Validate OpenAPI Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # For breaking change detection

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyyaml openapi-spec-validator jsonschema

      - name: Bundle modular OpenAPI files
        run: |
          cd openapi
          python3 build_openapi.py
          echo "✓ Bundling successful"

      - name: Validate OpenAPI syntax (YAML parsing)
        run: |
          python3 - << 'EOF'
          import yaml
          from pathlib import Path
          
          spec_file = Path('openapi/openapi.yaml')
          try:
              with spec_file.open('r', encoding='utf-8') as f:
                  spec = yaml.safe_load(f)
              print(f"✓ OpenAPI syntax valid")
              print(f"  Paths: {len(spec.get('paths', {}))}")
              print(f"  Schemas: {len(spec.get('components', {}).get('schemas', {}))}")
          except yaml.YAMLError as e:
              print(f"✗ YAML syntax error: {e}")
              exit(1)
          EOF

      - name: Validate OpenAPI semantics
        run: |
          python3 - << 'EOF'
          from openapi_spec_validator import validate_spec
          from openapi_spec_validator.exceptions import OpenAPIValidationError
          import yaml
          from pathlib import Path
          
          try:
              with Path('openapi/openapi.yaml').open('r') as f:
                  spec = yaml.safe_load(f)
              validate_spec(spec)
              print("✓ OpenAPI semantics valid")
          except OpenAPIValidationError as e:
              print(f"✗ OpenAPI validation failed: {e}")
              exit(1)
          except Exception as e:
              print(f"✗ Validation error: {e}")
              exit(1)
          EOF

      - name: Check operation ID uniqueness
        run: |
          python3 - << 'EOF'
          import yaml
          from pathlib import Path
          from collections import defaultdict
          
          spec_file = Path('openapi/openapi.yaml')
          with spec_file.open('r') as f:
              spec = yaml.safe_load(f)
          
          op_ids = defaultdict(list)
          for path, methods in spec.get('paths', {}).items():
              for method, operation in methods.items():
                  if isinstance(operation, dict):
                      op_id = operation.get('operationId')
                      if op_id:
                          op_ids[op_id].append(f"{method.upper()} {path}")
          
          duplicates = {k: v for k, v in op_ids.items() if len(v) > 1}
          
          if duplicates:
              print(f"✗ Found {len(duplicates)} duplicate operation IDs:")
              for op_id, paths in duplicates.items():
                  print(f"  {op_id}:")
                  for path in paths:
                      print(f"    - {path}")
              exit(1)
          else:
              print(f"✓ All {len(op_ids)} operation IDs are unique")
          EOF

      - name: Lint operation ID naming conventions
        run: |
          python3 - << 'EOF'
          import yaml
          import re
          from pathlib import Path
          
          spec_file = Path('openapi/openapi.yaml')
          with spec_file.open('r') as f:
              spec = yaml.safe_load(f)
          
          violations = []
          for path, methods in spec.get('paths', {}).items():
              for method, operation in methods.items():
                  if isinstance(operation, dict):
                      op_id = operation.get('operationId')
                      if not op_id:
                          violations.append((path, method, "Missing operationId"))
                      elif not re.match(r'^[a-z][a-zA-Z0-9]*$', op_id):
                          violations.append((path, method, f"Invalid format: {op_id}"))
                      elif not op_id[0].islower():
                          violations.append((path, method, f"Must start with lowercase: {op_id}"))
          
          if violations:
              print(f"✗ Found {len(violations)} operation ID violations:")
              for path, method, msg in violations[:5]:
                  print(f"  {method.upper()} {path}: {msg}")
              if len(violations) > 5:
                  print(f"  ... and {len(violations) - 5} more")
              exit(1)
          else:
              print(f"✓ All operation IDs follow naming conventions")
          EOF

      - name: Detect breaking changes
        if: github.event_name == 'pull_request'
        run: |
          cd openapi
          python3 detect_breaking_changes.py openapi.yaml
          echo "✓ Breaking change detection complete"

  build-sdks:
    name: Generate SDK Artifacts (preview)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Check OpenAPI Generator availability
        run: |
          echo "ℹ SDK generation pipeline ready"
          echo "  Supported targets: TypeScript, JavaScript, PHP"
          echo "  Status: Next phase to implement"

      - name: Prepare SDK generation metadata
        run: |
          python3 - << 'EOF'
          import yaml
          import json
          from pathlib import Path
          from collections import defaultdict
          
          spec_file = Path('openapi/openapi.yaml')
          with spec_file.open('r') as f:
              spec = yaml.safe_load(f)
          
          metadata = {
              'version': spec.get('info', {}).get('version', 'unknown'),
              'title': spec.get('info', {}).get('title', 'Unknown'),
              'paths': len(spec.get('paths', {})),
              'schemas': len(spec.get('components', {}).get('schemas', {})),
              'operations_by_domain': defaultdict(int)
          }
          
          for path, methods in spec.get('paths', {}).items():
              for method, operation in methods.items():
                  if isinstance(operation, dict):
                      tags = operation.get('tags', ['untagged'])
                      metadata['operations_by_domain'][tags[0]] += 1
          
          metadata['operations_by_domain'] = dict(metadata['operations_by_domain'])
          
          output_file = Path('build/sdk-metadata.json')
          output_file.parent.mkdir(exist_ok=True)
          output_file.write_text(json.dumps(metadata, indent=2))
          
          print(json.dumps(metadata, indent=2))
          EOF

      - name: Upload SDK metadata
        uses: actions/upload-artifact@v3
        with:
          name: sdk-metadata
          path: build/sdk-metadata.json

  report:
    name: Generate Validation Report
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Create validation summary
        run: |
          echo "## OpenAPI Contract Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "✅ All validations passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "- Syntax validation: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Semantic validation: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Operation ID uniqueness: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Naming conventions: ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Generate TypeScript SDK" >> $GITHUB_STEP_SUMMARY
          echo "2. Generate JavaScript SDK" >> $GITHUB_STEP_SUMMARY
          echo "3. Generate PHP SDK" >> $GITHUB_STEP_SUMMARY
          echo "4. Compile and test SDKs" >> $GITHUB_STEP_SUMMARY
