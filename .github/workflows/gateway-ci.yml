name: Gateway CI

on:
  push:
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      GATEWAY_REDIS_HOST: 127.0.0.1
      GATEWAY_REDIS_PORT: 6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: redis

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq redis-tools

      - name: Make scripts executable
        run: |
          chmod +x ./run-php-services.sh
          chmod +x ./tests/gateway_smoke.sh
          chmod +x ./tests/quota_integration.php || true

      - name: Start PHP services
        run: |
          ./run-php-services.sh
          # give servers time to boot
          sleep 3

      - name: Wait for gateway
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "gateway up"; break; fi
            sleep 1
          done

      - name: Run gateway smoke tests
        run: |
          ./tests/gateway_smoke.sh

      - name: Make quota script executable
        run: |
          chmod +x ./tests/quota_integration.sh
      - name: Reset auth data
        run: |
          rm -f services/data/auth_users.json || true

      - name: Run quota integration test
        run: |
          ./tests/quota_integration.sh

      - name: Teardown
        if: always()
        run: |
          pkill -f "php -S" || true
