name: Compile Policy Artifact

on:
  push:
    paths:
      - 'CONTROL_PLANE_POLICY.yml'
      - 'services/lib/PolicyCompiler/**'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Compile policy
        run: |
          php tools/compile-policy.php

      - name: Validate policy and compiled artifact
        run: |
          php tools/policy-validator.php --strict --policy=CONTROL_PLANE_POLICY.yml
          php tools/check-compiled-artifact.php

      - name: Upload compiled policy
        uses: actions/upload-artifact@v4
        with:
          name: compiled-policy
          path: build/compiled-policy.json
