name: Marketplace CI

on:
  push:
  pull_request:

jobs:
  marketplace-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        category: [security, dependency, publishing, ratings, artifact]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Run Marketplace CI group
        run: bash ./tools/marketplace-ci.sh ${{ matrix.category }}

  marketplace-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install TS SDK dependencies
        run: |
          cd sdk/typescript/gd-module-sdk
          npm ci
      - name: Build TS SDK
        run: |
          cd sdk/typescript/gd-module-sdk
          npm run build
      - name: Start Marketplace servers
        run: |
          php -S 127.0.0.1:8006 -t services/marketplace services/marketplace/server.php > /tmp/marketplace.log 2>&1 &
          echo $! > /tmp/mpid
          php -S 127.0.0.1:8009 -t services/tenant services/tenant/server.php > /tmp/tenant.log 2>&1 &
          echo $! > /tmp/tpid
          sleep 1
      - name: Run TS tests
        run: |
          node sdk/typescript/gd-module-sdk/dist/test/dependency-resolution.js
          node sdk/typescript/gd-module-sdk/dist/test/ratings-publish.js
      - name: Stop Marketplace servers
        if: always()
        run: |
          kill $(cat /tmp/mpid) || true
          kill $(cat /tmp/tpid) || true

  marketplace-ui:
    runs-on: ubuntu-latest
    needs: marketplace-ts
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install UI test dependencies
        run: |
          npm install
          npx playwright install chromium
      - name: Start Marketplace server (ephemeral data dir)
        env:
          GDWB_DATA_BASE: ${{ runner.temp }}/gdwb-data-${{ github.run_id }}
        run: |
          mkdir -p "$GDWB_DATA_BASE"
          echo "GDWB_DATA_BASE=$GDWB_DATA_BASE"
          php -S 127.0.0.1:8006 -t services/marketplace services/marketplace/server.php > /tmp/marketplace.log 2>&1 &
          echo $! > /tmp/mpid
          sleep 2
      - name: Run Playwright UI tests (with traces)
        env:
          SKIP_SERVER_START: '1'
          GDWB_DATA_BASE: ${{ runner.temp }}/gdwb-data-${{ github.run_id }}
        run: |
          # enable full trace recording for all tests so we can upload traces
          npx playwright test ui-tests/marketplace-ui.spec.js --project=chromium --reporter=list --trace=retain-on-failure
      - name: Restore snapshot baseline/history cache
        uses: actions/cache@v4
        with:
          path: |
            tools/snapshot-baselines
            tools/snapshot-history
            tools/snapshot-diffs
          key: snapshot-diff-${{ github.ref_name }}
      - name: Run snapshot diff engine
        env:
          GDWB_DATA_BASE: ${{ runner.temp }}/gdwb-data-${{ github.run_id }}
        run: |
          node tools/snapshot.js diff
      - name: Check approval status (if diff failed)
        if: failure()
        run: |
          echo "::error::Snapshot differences detected. Approval required to promote baseline."
          echo "To approve and promote baseline, run:"
          echo "node tools/snapshot.js approve --approved-by '<your-name>' [--reason '<reason>']"
          exit 1
      - name: Run snapshot architecture intelligence
        if: success()
        env:
          GDWB_DATA_BASE: ${{ runner.temp }}/gdwb-data-${{ github.run_id }}
        run: |
          node tools/snapshot.js analyze
      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-snapshots-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gdwb-data-${{ github.run_id }}/*.json
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: |
            test-results/**/trace.zip
            playwright-report
      - name: Upload snapshot diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diff-artifacts-${{ github.run_id }}
          path: |
            tools/snapshot-baselines/**
            tools/snapshot-history/**
            tools/snapshot-diffs/*.html
      - name: Stop Marketplace server
        if: always()
        run: |
          kill $(cat /tmp/mpid) || true

  effectiveness-governance:
    runs-on: ubuntu-latest
    needs: marketplace-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Start Marketplace server for effectiveness validation
        run: |
          php -S 127.0.0.1:8006 -t services/marketplace services/marketplace/server.php > /tmp/marketplace.log 2>&1 &
          echo $! > /tmp/mpid
          sleep 2
      - name: Run effectiveness governance validation
        run: |
          node scripts/effectiveness-ci-reporter.js
      - name: Stop Marketplace server
        if: always()
        run: |
          kill $(cat /tmp/mpid) || true
      - name: Upload effectiveness governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effectiveness-governance-${{ github.run_id }}
          path: |
            ci-artifacts/effectiveness-metrics.json
            ci-artifacts/effectiveness-report.html

