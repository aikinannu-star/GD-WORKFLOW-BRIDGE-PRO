version: '3.9'

services:
  # Core License Server (existing)
  license-server:
    build:
      context: ../..
      dockerfile: ../license-server/Dockerfile
    ports:
      - "8101:8001"
    environment:
      LICENSE_SERVER_ENV: dev
      DATABASE_URL: postgresql://user:password@postgres:5432/gdwb_app
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  # Auth Service
  auth-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.auth
    ports:
      - "8102:8002"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/gdwb_app
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      SERVICE: auth
      SERVICE_PORT: "8002"
    depends_on:
      - postgres

  # Billing Service
  billing-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.php-service
    ports:
      - "8103:8003"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/gdwb_app
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      SERVICE: billing
      SERVICE_PORT: "8003"
    depends_on:
      - postgres

  # CMS Service
  cms-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.php-service
    ports:
      - "8104:8004"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/gdwb_app
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      SERVICE: cms
      SERVICE_PORT: "8004"
    depends_on:
      - postgres
      - s3-local

  # Domains Service
  domains-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.php-service
    ports:
      - "8105:8005"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/gdwb_app
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY}
      GODADDY_API_KEY: ${GODADDY_API_KEY}
      SERVICE: domains
      SERVICE_PORT: "8005"
    depends_on:
      - postgres

  # Marketplace Service
  marketplace-service:
    image: gdwb-marketplace-test
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.php-service
    ports:
      - "8106:8006"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/gdwb_app
      SERVICE: marketplace
      SERVICE_PORT: "8006"
    working_dir: /app
    entrypoint: ["php"]
    command: ["-S", "0.0.0.0:8006", "-t", "/app/services/marketplace", "/app/services/marketplace/server.php"]
    depends_on:
      - postgres

  # Usage Service
  usage-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.php-service
    ports:
      - "8107:8007"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/gdwb_app
      REDIS_URL: redis://redis:6379
      SERVICE: usage
      SERVICE_PORT: "8007"
    depends_on:
      - postgres
      - redis

  # Admin Service
  admin-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.php-service
    ports:
      - "8108:8008"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/gdwb_app
      SERVICE: admin
      SERVICE_PORT: "8008"
    depends_on:
      - postgres

  # API Gateway
  api-gateway:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - license-server
      - auth-service
      - billing-service
      - cms-service
      - domains-service
      - marketplace-service
      - usage-service
      - admin-service

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gdwb_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/schemas:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # LocalStack (local AWS simulation)
  s3-local:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3
      DEBUG: 1
      DATA_DIR: /tmp/localstack/data
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/tmp/localstack

volumes:
  postgres_data:
  redis_data:
  localstack_data:
