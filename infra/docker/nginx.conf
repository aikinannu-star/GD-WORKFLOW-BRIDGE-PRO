upstream license_server {
    server license-server:8001;
}
upstream auth_service {
    server auth-service:8002;
}
upstream billing_service {
    server billing-service:8003;
}
upstream cms_service {
    server cms-service:8004;
}
upstream domains_service {
    server domains-service:8005;
}
upstream marketplace_service {
    server marketplace-service:8006;
}
upstream usage_service {
    server usage-service:8007;
}
upstream admin_service {
    server admin-service:8008;
}

server {
    listen 80;
    server_name _;

    # License API
    location /api/v1/license/ {
        proxy_pass http://license_server;
    }

    # Auth API
    location /api/v1/auth/ {
        proxy_pass http://auth_service;
    }

    # Billing API
    location /api/v1/billing/ {
        proxy_pass http://billing_service;
    }

    # CMS API
    location /api/v1/cms/ {
        proxy_pass http://cms_service;
    }

    # Domains API
    location /api/v1/domains/ {
        proxy_pass http://domains_service;
    }

    # Marketplace API
    location /api/v1/marketplace/ {
        proxy_pass http://marketplace_service;
    }

    # Usage API
    location /api/v1/usage/ {
        proxy_pass http://usage_service;
    }

    # Admin API
    location /api/v1/admin/ {
        proxy_pass http://admin_service;
    }

    # Health check
    location /health {
        proxy_pass http://license_server;
    }
}
